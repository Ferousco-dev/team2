services:
  - type: web
    name: opportunity-hub-web
    env: php
    plan: free
    buildCommand: composer install
    startCommand: apache2-foreground
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: opportunity-hub-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: opportunity-hub-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: opportunity-hub-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: opportunity-hub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: opportunity-hub-db
          property: password

databases:
  - name: opportunity-hub-db
    plan: free
    databaseName: opportunityhub
    user: postgres
