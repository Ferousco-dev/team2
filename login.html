<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | OpportunityHub</title><link rel="stylesheet" href="css/style.css"></head><body><main class="auth-page">
<a class="brand auth-brand" href="index.html">OpportunityHub</a><form class="auth-card" id="loginForm" novalidate>
<header><p class="eyebrow">WELCOME BACK</p><h1>Login</h1><p>Access your OpportunityHub account.</p></header>
<p class="form-message" id="loginMessage" role="alert"></p>
<section class="form-group"><label for="email">Email address</label><input id="email" type="email" required><small class="error" id="loginEmailError"></small></section>
<section class="form-group"><label for="password">Password</label><input id="password" type="password" required><small class="error" id="loginPasswordError"></small></section>
<button class="button button-full" type="submit">Login</button><p class="auth-footer">Don't have an account? <a href="register.html">Register</a></p>
</form></main><script src="js/auth.js"></script></body></html>
